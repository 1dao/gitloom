# gitloom configuration.
#
# Precedence is FIRST WINS, and command-line KEY=VAL arguments are read before
# any file, so they beat everything:
#
#     bin\xnet.exe main.lua LISTEN_PORT=9000 ANON_READ=0
#
# gitloom.local.cfg is loaded BEFORE this file, so anything set there overrides
# what is here. That file is in .gitignore — put secrets in it, not here.

# ── Listener ────────────────────────────────────────────────────────────────
LISTEN_HOST=0.0.0.0
LISTEN_PORT=8686

# Terminate TLS in-process. Strongly recommended before exposing gitloom beyond
# localhost: git speaks HTTP Basic and re-sends the credential on EVERY request
# of a clone or push, so plain HTTP puts the password on the wire repeatedly.
HTTPS=0
TLS_CERT_FILE=
TLS_KEY_FILE=
TLS_KEY_PASSWORD=

# Seconds a freshly accepted connection has to produce one complete request
# before it is dropped. Bounds both port scanners that never speak and slowloris
# clients that dribble bytes. 0 disables it.
HANDSHAKE_TIMEOUT_SEC=30

# Ceiling on a single request body, in MiB. THIS IS THE PUSH SIZE LIMIT: the
# whole POST body is buffered in memory while the codec parses it, so a push
# larger than this is rejected with 413. Raising it raises peak memory by the
# same amount per concurrent push.
MAX_REQUEST_SIZE_MB=64

# ── Storage ─────────────────────────────────────────────────────────────────
# Bare repositories live at <REPO_ROOT>/<owner>/<name>.git, with the listing
# index at <REPO_ROOT>/index.json.
REPO_ROOT=repos
DATA_DIR=data
TMP_DIR=tmp

# Owner assumed when a URL names only a repository (/site.git rather than
# /alice/site.git).
DEFAULT_OWNER=root
DEFAULT_BRANCH=main

# ── git ─────────────────────────────────────────────────────────────────────
# gitloom drives the real git binary; it does not reimplement git. Set this to
# an absolute path if git is not on PATH.
GIT_BIN=git

# Size of the process pool. Every git invocation blocks one worker for its whole
# duration, so this is the number of concurrent clones/pushes that can make
# progress at once. More workers cost one OS thread and one Lua state each.
GIT_WORKERS=4

# Kill a git process that runs longer than this, in seconds. 0 = no limit.
#
# NOT 0 by default. A client that disconnects mid-clone does not stop the git
# process it started, and nothing else will: with no limit, one abandoned fetch
# of a large repository holds a worker until it finishes on its own, and
# GIT_WORKERS of them leave the instance unable to serve anything. That is
# reachable without credentials on a public repository.
#
# 600s is chosen to be far longer than any legitimate operation on a repository
# of sane size while still bounding the damage. Raise it if you host something
# genuinely huge; the cost of enforcement is a PowerShell start-up per command
# on Windows (~200ms), paid on every git invocation.
GIT_TIMEOUT_SEC=600

# How the smart-HTTP body is moved between gitloom and the git child.
#
#   auto  stream through pipes wherever the runtime supports it (Linux), and
#         fall back to file staging where it does not (Windows)
#   off   always stage through files
#
# Streaming is what makes a clone start immediately: the child's stdout goes out
# as chunked HTTP as it is produced, instead of the response waiting for a
# Content-Length that is only knowable once git has finished. It needs pollable
# pipes, which WSAPoll cannot provide, so Windows always stages regardless.
#
# The switch exists because this path is new. If a Linux deployment misbehaves,
# GIT_STREAM=off restores the Phase 0 behaviour without a rebuild.
GIT_STREAM=auto

# How many streamed clones/pushes may run at once. Defaults to GIT_WORKERS.
#
# The streaming path spawns its git child directly instead of going through the
# process pool, so without a cap the number of concurrent git processes is the
# number of concurrent POSTs — which an anonymous client chooses, on any public
# repository, and each one also holds up to STREAM_PAUSE_HIGH_KB of buffered
# packfile. A request that finds every slot busy is not refused: it falls back
# to file staging, which queues on the pool. So an instance runs at most
# GIT_STREAM_MAX + GIT_WORKERS git processes, and a burst gets slower clones
# rather than an unbounded fan-out.
#
# 0 = no cap (not advisable on a public instance).
GIT_STREAM_MAX=4

# Flow control for the streaming transport.
#
# git produces a packfile far faster than a client on a real network can take
# it. Without a brake, every byte the child emits is queued on the connection
# immediately, the send buffer reaches its cap, and writes start being refused
# mid-chunk — which the client reports as a malformed chunked encoding. So
# reading from the child stops once the connection has this much queued, and
# starts again once it has drained below the low mark. The child then blocks on
# its own stdout, which is the backpressure a pipeline should have.
#
# Higher HIGH = more memory per concurrent clone, fewer pause/resume cycles.
# The gap between HIGH and LOW is hysteresis; too small and it thrashes.
STREAM_PAUSE_HIGH_KB=4096
STREAM_PAUSE_LOW_KB=1024

# How often to re-check a paused stream for drainage, in ms. There is no
# drain callback in the channel layer, so this is polled. It only has to be
# short relative to how long the socket takes to move HIGH-LOW bytes.
STREAM_DRAIN_MS=20

# ── Scratch files ───────────────────────────────────────────────────────────
# Each fetch/push stages its request body and its response through files in
# TMP_DIR. A finished response releases its file, and the sweeper unlinks it
# once TMP_TTL_SEC has passed — the delay is because the C layer keeps the file
# open until the response has fully drained to the socket.
# Largest file the raw endpoint will serve, in MiB. A blob is written to a
# scratch file and streamed from C, so this bounds disk churn rather than
# memory; it exists mainly so one enormous file in one repository cannot be used
# to fill TMP_DIR. Clone is unaffected — this is the browsing path only.
MAX_BLOB_MB=32

TMP_TTL_SEC=600
TMP_SWEEP_MS=60000

# ── Accounts and access ─────────────────────────────────────────────────────
# Created once, only when no account exists at all. Leaving these set across
# restarts is safe: bootstrap does nothing when the account file is non-empty,
# so it will not reset a password that was later changed. Move them to
# gitloom.local.cfg.
ADMIN_USER=admin
ADMIN_PASSWORD=change-me-now

USERS_FILE=data/users.json
AUTH_REALM=gitloom
AUTH_MIN_PASSWORD=8

# PBKDF2 iterations for password hashing. Higher is better against an offline
# attack on the account file and costs proportionally more per login. The
# verification cache below means a clone pays it once, not once per request.
AUTH_PBKDF2_ITER=10000

# How long a verified credential stays cached, in seconds. git re-sends the
# Authorization header on every request of an operation, so without this a
# single clone would run the KDF several times. The cache key includes the
# credential, so a changed or revoked one is never satisfied from it.
AUTH_CACHE_SEC=60

# How long a REJECTED credential is remembered, in seconds. git re-sends the
# same wrong password on every request of an operation, so without this a single
# typo costs several full KDF runs. Short, so a corrected password takes effect
# almost immediately.
AUTH_NEG_CACHE_SEC=10

# Credential-failure backoff. AUTH_FAIL_MAX failures from one source address, or
# against one username, inside AUTH_FAIL_WINDOW_SEC locks that key out for
# AUTH_LOCKOUT_SEC. Both counters are checked; either can trip.
#
# This is what makes password guessing and KDF-exhaustion unattractive: past the
# threshold an attempt is refused before the hash runs, so guesses stop costing
# the server anything. 0 in AUTH_FAIL_MAX disables it entirely.
AUTH_FAIL_MAX=10
AUTH_FAIL_WINDOW_SEC=60
AUTH_LOCKOUT_SEC=300

# May an unauthenticated client clone a repository that is not marked private?
# Set to 0 to require an account for every operation, which also makes "public"
# mean "visible to any account" rather than "visible to the internet".
ANON_READ=1

# ── Development ─────────────────────────────────────────────────────────────
# App modules always run in separate environments and only export through
# g_exports. This additional guard locks the root _G after startup, so mistakes
# in main/runtime integration code raise instead of silently reading nil. Turn
# it off only when integrating third-party code that creates root globals.
STRICT_GLOBALS=1

# Runtime log verbosity. Higher is quieter.
#LOG_LEVEL=3
